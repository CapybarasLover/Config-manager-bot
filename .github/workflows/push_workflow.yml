name: deploy_new
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > .env <<EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          GERMAN_PANEL_HOME_URL=${{ secrets.GERMAN_PANEL_HOME_URL }}
          XUI_API_TOKEN_GERM=${{ secrets.XUI_API_TOKEN_GERM }}
          GERM_SUB_BASE_URL=${{ secrets.GERM_SUB_BASE_URL }}
          LATV_PANEL_HOME_URL=${{ secrets.LATV_PANEL_HOME_URL }}
          XUI_API_TOKEN_LATV=${{ secrets.XUI_API_TOKEN_LATV }}
          POL_PANEL_HOME_URL=${{ secrets.POL_PANEL_HOME_URL }}
          XUI_API_TOKEN_POL=${{ secrets.XUI_API_TOKEN_POL }}
          POL_SUB_BASE_URL=${{ secrets.POL_SUB_BASE_URL }}
          POL_WS_INBOUND=${{ secrets.POL_WS_INBOUND }}
          POL_XHTTP_INBOUND=${{ secrets.POL_XHTTP_INBOUND }}
          POL_REALITY_INBOUND=${{ secrets.POL_REALITY_INBOUND }}
          FIN_PANEL_HOME_URL=${{ secrets.FIN_PANEL_HOME_URL }}
          XUI_API_TOKEN_FIN=${{ secrets.XUI_API_TOKEN_FIN }}
          FIN_SUB_BASE_URL=${{ secrets.FIN_SUB_BASE_URL }}
          FIN_WS_INBOUND=${{ secrets.FIN_WS_INBOUND }}
          FIN_XHTTP_INBOUND=${{ secrets.FIN_XHTTP_INBOUND }}
          FIN_REALITY_INBOUND=${{ secrets.FIN_REALITY_INBOUND }}
          GERM_WS_INBOUND=${{ secrets.GERM_WS_INBOUND }}
          LATV_WS_INBOUND_PROD=${{ secrets.LATV_WS_INBOUND_PROD }}
          ENABLED_COUNTRIES=${{ secrets.ENABLED_COUNTRIES }}
          DB_LINK_PROD=${{ secrets.DB_LINK_PROD }}
          DB_LINK_DEV=${{ secrets.DB_LINK_DEV }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          ADMIN_CHATS=${{ secrets.ADMIN_CHATS }}
          EOF

      - name: Create env.txt for artifacts
        run: |
          {
            echo "BOT_TOKEN="
            echo "GERMAN_PANEL_HOME_URL="
            echo "XUI_API_TOKEN_GERM="
            echo "GERM_SUB_BASE_URL="
            echo "LATV_PANEL_HOME_URL="
            echo "XUI_API_TOKEN_LATV="
            echo "POL_PANEL_HOME_URL="
            echo "XUI_API_TOKEN_POL="
            echo "POL_SUB_BASE_URL="
            echo "POL_WS_INBOUND="
            echo "POL_XHTTP_INBOUND="
            echo "POL_REALITY_INBOUND="
            echo "FIN_PANEL_HOME_URL="
            echo "XUI_API_TOKEN_FIN="
            echo "FIN_SUB_BASE_URL="
            echo "FIN_WS_INBOUND="
            echo "FIN_XHTTP_INBOUND="
            echo "FIN_REALITY_INBOUND="
            echo "GERM_WS_INBOUND="
            echo "LATV_WS_INBOUND_PROD="
            echo "ENABLED_COUNTRIES="
            echo "DB_LINK_PROD="
            echo "DB_LINK_DEV="
            echo "DB_USER="
            echo "DB_PASSWORD="
            echo "DB_NAME="
            echo "ADMIN_CHATS="
          } > env.txt

      - name: Docker Compose
        run: |
          docker compose down || true
          docker compose build
          docker compose up -d
          sleep 20
          docker compose ps

      - name: Wait for backend healthy
        run: |
          set -e
          echo "Waiting for bot container to be healthy..."
          for i in {1..30}; do
            BOT_ID=$(docker compose ps -q bot 2>/dev/null || true)
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$BOT_ID" 2>/dev/null || echo "starting")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Bot is healthy!"
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              echo "Bot is unhealthy"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for bot health"
          exit 1

      - name: Database connectivity test
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          set -e
          COUNT=$(docker compose exec -T db \
            psql -U "$DB_USER" -d "$DB_NAME" -t -A -c "SELECT COUNT(*) FROM tg_user;")
          echo "Rows in tg_user: $COUNT"
          echo "$COUNT" > db-count.txt

      - name: Create test report
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          {
            echo "# Deployment Test Report"
            echo "- Database: $DB_NAME"
            echo "- Rows in tg_user:"
            cat db-count.txt
          } > test-report.md
          cat test-report.md

      - name: Save Docker logs
        if: always()
        run: |
          docker compose logs > deployment-logs.txt 2>&1 || true
          docker images > docker-images.txt || true
          docker ps -a > docker-ps.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devops-artifacts
          path: |
            env.txt
            test-report.md
            db-count.txt
            deployment-logs.txt
            docker-images.txt
            docker-ps.txt
          retention-days: 30